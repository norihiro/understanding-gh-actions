name: 'Try GITHUB_ENV'

on: push

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: 'Output something'
        run: |
          echo "var1=$(date -R)" >> $GITHUB_ENV
          sleep 2
          echo "var2=$(date -R)" >> $GITHUB_ENV
          sleep 1

      - name: 'Environment variable'
        run: |
          echo $var1
          echo $var2

      - name: 'Explicitly set variables'
        env:
          var1: ${{ env.var1 }}
          var2: ${{ env.var2 }}
        run: |
          echo $var1
          echo $var2
